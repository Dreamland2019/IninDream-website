<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ININDREAM · 宿舍</title>
<style>
:root{
  --bg:#070a10; --panel:rgba(8,13,21,.84); --line:rgba(120,200,220,.20);
  --txt:#e2ecf4; --dim:#8298ac; --accent:#5fd8e8; --accent2:#e0574a;
  --shadow:0 18px 50px rgba(0,0,0,.55);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none}

/* ══════════════════════════════════════════════════════
   舞台：比视口大 18%，超出的部分就是【镜头可平移范围】
   4:3 的图放在 16:9 屏上，cover 后纵向会溢出 →
   平移正好把裁掉的部分找回来（同明日方舟首页）
   ══════════════════════════════════════════════════════ */
#wrap{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 40%, #101a26 0%, #070a10 72%)}
.stage{
  position:absolute;left:50%;top:50%;
  aspect-ratio:2048/1536;          /* 4:3，与渲染一致 */
  min-width:118%;min-height:118%;  /* ★ 平移余量 */
  transform:translate(-50%,-50%) translate3d(0,0,0);
  will-change:transform;
}
.layer{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;
  opacity:0;transition:opacity .55s var(--ease);will-change:opacity}
.layer.on{opacity:1}

#outlines{position:absolute;inset:0;pointer-events:none}
#outlines img{
  position:absolute;inset:0;width:100%;height:100%;opacity:0;
  transition:opacity .16s;
  filter:
    drop-shadow(0 0 1.5px rgba(150,245,255,.95))
    drop-shadow(0 0 5px rgba(95,216,232,.85))
    drop-shadow(0 0 14px rgba(95,216,232,.45));
}
#outlines img.on{opacity:1}

.vignette{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to bottom, rgba(7,10,16,.50) 0%, transparent 14%,
                    transparent 85%, rgba(7,10,16,.68) 100%),
    linear-gradient(to right, rgba(7,10,16,.50) 0%, transparent 10%,
                    transparent 90%, rgba(7,10,16,.50) 100%)}

/* 热区层（现在只用于「显示可点击区域」调试，不参与命中判定） */
#hots{position:absolute;inset:0;pointer-events:none}
#hots .hot{position:absolute;border-radius:4px}
body.hints #hots .hot{outline:1px dashed rgba(95,216,232,.5);background:rgba(95,216,232,.07)}

/* 标签（鼠标命中家具时出现） */
#stage .tag{
  position:absolute;z-index:8;pointer-events:none;
  background:var(--panel);border:1px solid var(--line);border-radius:3px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:6px 12px;font-size:12.5px;letter-spacing:.04em;white-space:nowrap;
  opacity:0;transition:opacity .16s;box-shadow:var(--shadow);
  color:var(--txt);
}
#stage .tag.on{opacity:1}
#stage .tag small{color:var(--dim);margin-left:7px;font-size:10.5px;letter-spacing:.1em}

/* ══════════ UI ══════════ */
.hud{position:fixed;z-index:20;pointer-events:none}.hud > *{pointer-events:auto}
#topbar{top:0;left:0;right:0;display:flex;align-items:center;gap:16px;padding:16px 22px}
.brand{display:flex;align-items:center;gap:9px}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);
  box-shadow:0 0 10px var(--accent2);flex:0 0 auto}
.brand h1{font-size:14px;font-weight:600;letter-spacing:.2em}
.brand h1 em{font-style:normal;color:var(--dim);font-weight:400;font-size:10.5px;
  letter-spacing:.14em;margin-left:7px}
#viewlabel{margin-left:auto;text-align:right}
#viewlabel b{display:block;font-size:13px;font-weight:600;letter-spacing:.12em}
#viewlabel span{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.1em;margin-top:2px}

.arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:22;
  width:52px;height:78px;border:1px solid var(--line);border-radius:3px;
  background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt);
  transition:background .2s,border-color .2s,transform .2s,opacity .2s;box-shadow:var(--shadow)}
.arrow:hover{background:rgba(95,216,232,.14);border-color:rgba(95,216,232,.5);
  transform:translateY(-50%) scale(1.04)}
.arrow:active{transform:translateY(-50%) scale(.97)}
.arrow.off{opacity:.22;pointer-events:none}
#prev{left:20px}#next{right:20px}
.arrow svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

#bottombar{left:0;right:0;bottom:0;padding:16px 22px;display:flex;align-items:flex-end;gap:16px}
#dots{display:flex;gap:9px;align-items:center}
#dots button{all:unset;cursor:pointer;width:26px;height:3px;border-radius:2px;
  background:rgba(130,152,172,.32);transition:background .2s,width .2s}
#dots button:hover{background:rgba(130,152,172,.6)}
#dots button.on{background:var(--accent);width:40px;box-shadow:0 0 12px rgba(95,216,232,.5)}
#tools{margin-left:auto;display:flex;gap:9px;align-items:center}
.tool{all:unset;cursor:pointer;font-size:11px;letter-spacing:.1em;color:var(--dim);
  border:1px solid var(--line);border-radius:3px;padding:7px 12px;background:var(--panel);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:color .2s,border-color .2s,background .2s}
.tool:hover{color:var(--txt);border-color:rgba(95,216,232,.5);background:rgba(95,216,232,.1)}
.tool.on{color:var(--accent);border-color:rgba(95,216,232,.6);background:rgba(95,216,232,.13)}

#sheet{position:fixed;z-index:30;right:22px;bottom:80px;width:min(360px,calc(100vw - 44px));
  background:var(--panel);border:1px solid var(--line);border-radius:4px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);
  overflow:hidden;transform:translateX(calc(100% + 40px));opacity:0;
  transition:transform .42s var(--ease),opacity .42s var(--ease)}
#sheet.open{transform:translateX(0);opacity:1}
.sh-head{display:flex;align-items:flex-start;gap:11px;padding:15px 17px 13px;
  border-bottom:1px solid var(--line)}
.sh-icon{width:34px;height:34px;flex:0 0 auto;border-radius:3px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:16px;
  background:rgba(95,216,232,.08)}
.sh-t{flex:1;min-width:0}
.sh-t h2{font-size:15px;font-weight:600;letter-spacing:.05em}
.sh-t p{font-size:10.5px;color:var(--dim);letter-spacing:.12em;margin-top:3px}
.sh-x{all:unset;cursor:pointer;color:var(--dim);font-size:17px;line-height:1;padding:3px 6px;
  border-radius:3px;transition:color .2s,background .2s}
.sh-x:hover{color:var(--txt);background:rgba(255,255,255,.07)}
.sh-body{padding:15px 17px 17px}
.sh-desc{font-size:12.5px;line-height:1.75;color:#c3d3e0}
.sh-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.sh-tags span{font-size:10px;letter-spacing:.08em;color:var(--dim);
  border:1px solid var(--line);border-radius:2px;padding:3px 8px}
.sh-go{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;margin-top:15px;
  padding:10px 14px;border:1px solid rgba(95,216,232,.42);border-radius:3px;
  background:rgba(95,216,232,.1);color:var(--accent);font-size:12px;letter-spacing:.08em;
  transition:background .2s,border-color .2s;width:100%}
.sh-go:hover{background:rgba(95,216,232,.2);border-color:var(--accent)}
.sh-go svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.sh-go.soon{color:var(--dim);border-color:var(--line);background:rgba(255,255,255,.04);
  cursor:default}

#boot{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .6s}
#boot.done{opacity:0;pointer-events:none}
#boot .t{font-size:10.5px;letter-spacing:.36em;color:var(--dim)}
#boot .b{width:180px;height:1px;background:rgba(120,200,220,.16);overflow:hidden}
#boot .b i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

#toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-8px);z-index:40;
  background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 15px;
  font-size:12px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  backdrop-filter:blur(12px);white-space:nowrap;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 手机端提示条（请求陀螺仪权限）*/
#gyro{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:35;
  display:none;align-items:center;gap:10px;padding:10px 16px;
  background:var(--panel);border:1px solid var(--line);border-radius:3px;
  backdrop-filter:blur(12px);font-size:12px;box-shadow:var(--shadow)}
#gyro.show{display:flex}
#gyro button{all:unset;cursor:pointer;color:var(--accent);font-size:12px;
  border:1px solid rgba(95,216,232,.45);border-radius:2px;padding:4px 10px}

@media (max-width:760px){
  #topbar{padding:12px 14px}
  .brand h1{font-size:12px}.brand h1 em{display:none}
  #viewlabel b{font-size:11.5px}#viewlabel span{display:none}
  .arrow{width:40px;height:62px}#prev{left:8px}#next{right:8px}
  #bottombar{padding:12px 14px;flex-direction:column;align-items:stretch;gap:10px}
  #dots{justify-content:center}
  #tools{margin-left:0;justify-content:center;flex-wrap:wrap}
  #sheet{right:10px;left:10px;width:auto;bottom:10px;transform:translateY(calc(100% + 30px))}
  #sheet.open{transform:translateY(0)}
  #toast{top:52px;font-size:11px}
}
</style>
</head>
<body>
<div id="wrap">
  <div class="stage" id="stage">
    <div class="layer" id="layerA"></div>
    <div class="layer" id="layerB"></div>
    <div id="outlines"></div>
    <div class="vignette"></div>
    <div id="hots"></div>
  </div>
</div>

<div class="hud" id="topbar">
  <div class="brand"><span class="dot"></span><h1>ININDREAM<em>CLOSURE ROOM</em></h1></div>
  <div id="viewlabel"><b id="vname">—</b><span id="vdesc">—</span></div>
</div>

<div class="arrow" id="prev" role="button" aria-label="上一个机位">
  <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg></div>
<div class="arrow" id="next" role="button" aria-label="下一个机位">
  <svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg></div>

<div class="hud" id="bottombar">
  <div id="dots"></div>
  <div id="tools">
    <button class="tool" id="btn-hints">显示可点击区域</button>
    <button class="tool" id="btn-3d">进入 3D 宿舍 ↗</button>
    <!-- ★ 2026-10-26：借物表 / 开源致谢入口（原文件一直有，但页面上没有链接） -->
    <a class="tool" href="借物表-Credits.md" target="_blank" rel="noopener">借物表 / Credits</a>
  </div>
</div>

<div id="gyro"><span>倾斜手机可移动镜头</span><button id="gyro-ok">开启</button></div>

<div id="sheet">
  <div class="sh-head">
    <div class="sh-icon" id="sh-icon">▣</div>
    <div class="sh-t"><h2 id="sh-name">—</h2><p id="sh-sub">—</p></div>
    <button class="sh-x" id="sh-x" aria-label="关闭">✕</button>
  </div>
  <div class="sh-body">
    <div class="sh-desc" id="sh-desc">—</div>
    <div class="sh-tags" id="sh-tags"></div>
    <button class="sh-go" id="sh-go"><span id="sh-go-t">查看</span>
      <svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg></button>
  </div>
</div>

<div id="boot"><div class="t">LOADING</div><div class="b"><i></i></div></div>
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════
   机位（3 个功能区，4:3 画幅，图片与热区由 Blender 生成）
   ═══════════════════════════════════════════════════════ */
let VIEWS = [];   // 由 _views.json 的 zones 填充

/* 物件 → 网站栏目（★ 内容配置） */
const OBJECTS = {
  computerdesk:      { icon:'▣', name:'第一控制台', sub:'PORTFOLIO',
    desc:'主工作位。这里放作品集 —— 每块屏幕可以对应一个项目。',
    tags:['作品集','项目'], go:'查看作品集', href:'#' },
  cabinet:           { icon:'◫', name:'街机柜', sub:'ARCADE',
    desc:'收藏与娱乐。音乐播放器、小游戏、或者彩蛋。',
    tags:['音乐','小游戏'], go:'打开街机柜', href:'#' },
  shelf:             { icon:'▤', name:'展示柜', sub:'GALLERY',
    desc:'陈列柜。放插画、照片、或者想展示的任何东西。',
    tags:['画廊','图集'], go:'打开展示柜', href:'#' },
  collectioncabinet: { icon:'✦', name:'收藏柜', sub:'COLLECTION',
    desc:'收集品展示。徽章、成就、收藏的周边。',
    tags:['收藏','成就'], go:'查看收藏', href:'#' },
  officedesk:        { icon:'✎', name:'办公桌', sub:'ABOUT',
    desc:'关于我。自我介绍、经历、联系方式。',
    tags:['关于','联系'], go:'关于我', href:'#' },
  equipmentdesk:     { icon:'⚙', name:'设备桌', sub:'STACK',
    desc:'技术栈与工具。常用软件、硬件、工作流。',
    tags:['技术','工具'], go:'查看技术栈', href:'#' },
  chair:             { icon:'⛊', name:'电竞椅', sub:'ARCHIVE',
    desc:'坐下来歇会儿。博客归档、时间线。',
    tags:['博客','归档'], go:'翻翻归档', href:'#' },
  ledchair:          { icon:'◈', name:'LED 椅', sub:'MUSIC',
    desc:'会发光的小椅子。也许是个音乐播放器？',
    tags:['音乐'], go:'待定', href:'' },
  stool:             { icon:'○', name:'圆凳', sub:'LINKS',
    desc:'友链。放朋友们的小站。',
    tags:['友链'], go:'看看友链', href:'#' },
  table:             { icon:'▭', name:'茶几', sub:'GUESTBOOK',
    desc:'留言板。访客在这里留下痕迹。',
    tags:['留言'], go:'写留言', href:'#' },
  ceilingLight:      { icon:'◉', name:'顶灯', sub:'3D DORM',
    desc:'灯亮起来的时候，可以走进这间宿舍 —— 用 3D 视角自由参观。',
    tags:['3D','交互'], go:'进入 3D 宿舍', href:'walk.html' },
  workbench:         { icon:'⚒', name:'工作台', sub:'LAB',
    desc:'动手的地方。实验性的小玩意、WebGL demo、工具页面。',
    tags:['实验室','Demo'], go:'进实验室', href:'#' },
  poster_01:         { icon:'▤', name:'贴纸 · 一', sub:'POSTER', desc:'墙上的贴纸。',
    tags:['贴纸'], go:'待定', href:'' },
  poster_02:         { icon:'▤', name:'贴纸 · 二', sub:'POSTER', desc:'墙上的贴纸。',
    tags:['贴纸'], go:'待定', href:'' },
  poster_03:         { icon:'▤', name:'BARRAGE 招牌', sub:'POSTER',
    desc:'发光招牌。也许是个入口，或者纯粹好看。',
    tags:['贴纸','发光'], go:'待定', href:'' },
  carpet_01:         { icon:'◪', name:'地毯 · 蓝', sub:'HOME', desc:'站在这儿 —— 回到首页。',
    tags:['首页'], go:'回首页', href:'#' },
  carpet_02:         { icon:'◪', name:'地毯 · 红', sub:'MAP', desc:'站点地图。所有页面的入口。',
    tags:['导航'], go:'打开站点地图', href:'#' },
};

/* ═══════════════════════════════════════════════════════ 状态 */
let META=null, cur=0, silCache={}, maskCanvas={};
const stage=document.getElementById('stage');
const layerA=document.getElementById('layerA'), layerB=document.getElementById('layerB');
let front=layerA, back=layerB;
const boot=document.getElementById('boot'), bootBar=boot.querySelector('.b i');
const hots=document.getElementById('hots'), outlines=document.getElementById('outlines');
const dots=document.getElementById('dots'), prevBtn=document.getElementById('prev'),
      nextBtn=document.getElementById('next');
const vname=document.getElementById('vname'), vdesc=document.getElementById('vdesc');
const sheet=document.getElementById('sheet'), toastEl=document.getElementById('toast');
let toastTimer=null;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2200);}

/* ═══════════════════════════════════════════════════════
   ★ 镜头平移（鼠标 / 陀螺仪 / 自动漂移）
   ═══════════════════════════════════════════════════════ */
const pan = {
  tx:0, ty:0,      // 目标 [-1,1]
  x:0,  y:0,       // 当前（插值）
  idle:0,          // 无输入时的漂移相位
  hasInput:false,
};

function updatePan(){
  // 用未变换的布局尺寸算可平移余量
  const overX = Math.max(0, (stage.offsetWidth  - innerWidth ) / 2);
  const overY = Math.max(0, (stage.offsetHeight - innerHeight) / 2);
  const px = -pan.x * overX;
  const py = -pan.y * overY;
  stage.style.transform = `translate(-50%,-50%) translate3d(${px.toFixed(2)}px,${py.toFixed(2)}px,0)`;
}

(function panLoop(){
  // 无输入时缓慢漂移，让画面"活着"
  if(!pan.hasInput){
    pan.idle += 0.0035;
    pan.tx = Math.sin(pan.idle) * 0.34;
    pan.ty = Math.sin(pan.idle * 0.71 + 1.1) * 0.26;
  }
  pan.x += (pan.tx - pan.x) * 0.055;
  pan.y += (pan.ty - pan.y) * 0.055;
  updatePan();
  requestAnimationFrame(panLoop);
})();

// ── 桌面端：鼠标位置
addEventListener('mousemove', e=>{
  if(e.pointerType === 'touch') return;
  pan.hasInput = true;
  pan.tx = (e.clientX / innerWidth)  * 2 - 1;
  pan.ty = (e.clientY / innerHeight) * 2 - 1;
}, {passive:true});
// 鼠标离开窗口 → 恢复漂移
addEventListener('mouseout', e=>{ if(!e.relatedTarget) pan.hasInput = false; });

// ── 移动端：陀螺仪（同明日方舟首页）
let gyroBase = null, gyroOn = false;
function onOrient(e){
  if(e.gamma === null || e.beta === null) return;
  if(gyroBase === null) gyroBase = { g:e.gamma, b:e.beta };
  const dg = e.gamma - gyroBase.g;
  const db = e.beta  - gyroBase.b;
  const lim = 28;                       // 倾角满量程（度）
  const cl = v => Math.max(-1, Math.min(1, v/lim));
  pan.hasInput = true;
  pan.tx = cl(dg);
  pan.ty = cl(db);
}
function enableGyro(){
  const g = document.getElementById('gyro');
  const start = ()=>{
    addEventListener('deviceorientation', onOrient, {passive:true});
    gyroOn = true; g.classList.remove('show');
    toast('已开启 · 倾斜手机移动镜头');
  };
  if(typeof DeviceOrientationEvent !== 'undefined' &&
     typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(st=>{
      if(st === 'granted') start(); else toast('未获得陀螺仪权限');
    }).catch(()=>toast('陀螺仪不可用'));
  } else if(typeof DeviceOrientationEvent !== 'undefined'){
    start();
  } else {
    toast('此设备不支持陀螺仪');
  }
}
document.getElementById('gyro-ok').onclick = enableGyro;
// 触屏设备提示开启陀螺仪
if(matchMedia('(pointer: coarse)').matches){
  setTimeout(()=>document.getElementById('gyro').classList.add('show'), 1500);
}

/* ═══════════════════════════════════════════════════════
   轮廓描边：从 ID 遮罩抠出物件形状的边缘
   ═══════════════════════════════════════════════════════ */
function loadMaskCanvas(viewId){
  if(maskCanvas[viewId]) return Promise.resolve(maskCanvas[viewId]);
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas');
      c.width=im.naturalWidth; c.height=im.naturalHeight;
      const cx=c.getContext('2d',{willReadFrequently:true});
      cx.drawImage(im,0,0);
      const idata = cx.getImageData(0,0,c.width,c.height);
      // ★ 顺手把像素数据缓存下来，用于【像素级命中判定】
      const m = {cx, w:c.width, h:c.height, data:idata.data};
      maskCanvas[viewId]=m;
      res(m);
    };
    im.onerror=()=>res(null);
    im.src=`views/mask_${viewId}.webp`;
  });
}

/* ★ 像素级拾取：鼠标落在哪个物件身上 */
function pickByMask(clientX, clientY){
  const mk = maskCanvas[curViewId];
  if(!mk || !mk.data) return null;
  const r = stage.getBoundingClientRect();
  if(!r.width || !r.height) return null;
  const u = (clientX - r.left) / r.width;
  const v = (clientY - r.top ) / r.height;
  if(u < 0 || u > 1 || v < 0 || v > 1) return null;
  const mx = Math.min(mk.w-1, Math.max(0, Math.floor(u * mk.w)));
  const my = Math.min(mk.h-1, Math.max(0, Math.floor(v * mk.h)));
  const o = (my * mk.w + mx) * 4;
  const d = mk.data;
  if(d[o+3] < 8) return null;                     // 透明 → 没点到物件
  // 找最近的 ID 颜色
  let best = null, bd = 1e9;
  for(const key in META.id_colors){
    const c = META.id_colors[key];
    const dd = Math.abs(d[o]-c[0]) + Math.abs(d[o+1]-c[1]) + Math.abs(d[o+2]-c[2]);
    if(dd < bd){ bd = dd; best = key; }
  }
  return bd < 96 ? best : null;
}

async function buildOutline(viewId,key){
  const ck=viewId+'|'+key;
  if(silCache[ck]!==undefined) return silCache[ck];
  const mk=await loadMaskCanvas(viewId);
  if(!mk){silCache[ck]=null;return null;}
  const col=META.id_colors[key];
  if(!col){silCache[ck]=null;return null;}
  const [tr,tg,tb]=col, {w,h}=mk;
  const src=mk.cx.getImageData(0,0,w,h).data;

  const on=new Uint8Array(w*h);
  for(let i=0,p=0;i<src.length;i+=4,p++){
    if(src[i+3]<8) continue;
    if(Math.abs(src[i]-tr)+Math.abs(src[i+1]-tg)+Math.abs(src[i+2]-tb)<90) on[p]=1;
  }
  const edge=new Uint8Array(w*h);
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
    const p=y*w+x;
    if(on[p] && (!on[p-1]||!on[p+1]||!on[p-w]||!on[p+w])) edge[p]=1;
  }
  let cc=edge;
  for(let k=0;k<2;k++){
    const nx=new Uint8Array(w*h);
    for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
      const p=y*w+x;
      if(cc[p]||cc[p-1]||cc[p+1]||cc[p-w]||cc[p+w]) nx[p]=1;
    }
    cc=nx;
  }
  const out=document.createElement('canvas');
  out.width=w; out.height=h;
  const ox=out.getContext('2d');
  const img=ox.createImageData(w,h), d2=img.data;
  for(let p=0;p<w*h;p++){
    if(!cc[p]) continue;
    const i=p*4;
    d2[i]=210; d2[i+1]=250; d2[i+2]=255; d2[i+3]=255;
  }
  ox.putImageData(img,0,0);
  silCache[ck]=out.toDataURL('image/png');
  return silCache[ck];
}

/* ═══════════════════════════════════════════════════════ 启动 */
fetch('views/_views.json')
  .then(r=>r.json())
  .then(j=>{
    META=j;
    VIEWS = j.zones.map(z=>({ id:z.id, name:z.name, desc:z.desc,
                              img:`views/${z.id}.webp`, mask:`views/mask_${z.id}.webp` }));
    preload();
  })
  .catch(e=>{console.error(e);bootBar.style.width='100%';
    document.querySelector('#boot .t').textContent='数据载入失败';});

function preload(){
  let done=0,total=VIEWS.length;
  VIEWS.forEach(v=>{
    const im=new Image();
    im.onload=im.onerror=()=>{done++;
      bootBar.style.width=(done/total*100).toFixed(0)+'%';
      if(done===total) ready();};
    im.src=v.img;
  });
  VIEWS.forEach((v,i)=>{
    const b=document.createElement('button');
    b.title=v.name; b.onclick=()=>go(i); dots.appendChild(b);
  });
}
function ready(){
  boot.classList.add('done'); setTimeout(()=>boot.remove(),700);
  go(0,true);
}

/* ═══════════════════════════════════════════════════════ 切机位 */
function go(i,instant=false){
  if(!META) return;
  i=(i+VIEWS.length)%VIEWS.length;
  if(i===cur && !instant) return;
  cur=i;
  const v=VIEWS[i];
  back.style.backgroundImage=`url("${v.img}")`;
  if(instant){front.style.opacity=0;back.style.opacity=1;}
  else{back.style.opacity=1;front.style.opacity=0;}
  const t=front; front=back; back=t;

  vname.textContent=v.name; vdesc.textContent=v.desc;
  [...dots.children].forEach((b,k)=>b.classList.toggle('on',k===i));
  prevBtn.classList.toggle('off',i===0);
  nextBtn.classList.toggle('off',i===VIEWS.length-1);
  buildScene(v.id); closeSheet();
}

/* ═══════════════════════════════════════════════════════ 建场景：标签层 + 轮廓层 */
let curViewId = null;
const labs = document.createElement('div');   // 标签层（跟着包围盒位置）
labs.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:6';
const rectOf = {};                            // 每个物件的包围盒（用于放标签）

function buildScene(viewId){
  curViewId = viewId;
  hots.innerHTML=''; outlines.innerHTML=''; labs.innerHTML='';
  if(!labs.isConnected) document.getElementById('stage').appendChild(labs);
  const v=META.views[viewId]; if(!v) return;

  const list=Object.entries(v.rects)
    .filter(([g,r])=>OBJECTS[g] && r.visible_ratio>=0.45 && (r.width*r.height)>=1.5)
    .sort((a,b)=>(a[1].width*a[1].height)-(b[1].width*b[1].height));

  const jobs=[];
  list.forEach(([g,r])=>{
    const o=OBJECTS[g];
    rectOf[g]=r;

    // 轮廓层
    const img=document.createElement('img');
    img.dataset.key=g; img.alt='';
    outlines.appendChild(img);

    // 标签（平时隐藏，鼠标命中时才显示）
    const tag=document.createElement('div');
    tag.className='tag';
    tag.dataset.key=g;
    tag.style.left=(r.left+r.width/2)+'%';
    tag.style.top=(r.top<16 ? (r.top+r.height) : r.top)+'%';
    tag.style.transform='translate(-50%,'+(r.top<16?'14px':'calc(-100% - 14px)')+')';
    tag.innerHTML=`${o.name}<small>${o.sub||''}</small>`;
    labs.appendChild(tag);

    jobs.push({g,img});
  });

  // 异步生成轮廓（后台逐个做）
  (async()=>{
    for(const {g,img} of jobs){
      const url=await buildOutline(viewId,g);
      if(url&&img.isConnected) img.src=url;
      await new Promise(r=>setTimeout(r,0));
    }
  })();

  // 立刻把遮罩数据准备好（命中判定要用）
  loadMaskCanvas(viewId);
}

let hoverKey=null;
function setHover(key){
  if(hoverKey===key) return;
  hoverKey=key;
  outlines.querySelectorAll('img').forEach(im=>
    im.classList.toggle('on', !!key && im.dataset.key===key && !!im.src));
  labs.querySelectorAll('.tag').forEach(t=>
    t.classList.toggle('on', !!key && t.dataset.key===key));
  rendererHint(key);
}
function rendererHint(key){
  document.getElementById('wrap').style.cursor = key ? 'pointer' : 'default';
}

/* ═══════════════════════════════════════════════════════ 详情面板 */
function openSheet(key){
  const o=OBJECTS[key]; if(!o) return;
  document.getElementById('sh-icon').textContent=o.icon||'▣';
  document.getElementById('sh-name').textContent=o.name;
  document.getElementById('sh-sub').textContent=o.sub||'';
  document.getElementById('sh-desc').textContent=o.desc||'';
  document.getElementById('sh-tags').innerHTML=(o.tags||[]).map(t=>`<span>${t}</span>`).join('');
  const gb=document.getElementById('sh-go'), gt=document.getElementById('sh-go-t');
  if(o.href){gb.classList.remove('soon');gt.textContent=o.go||'查看';
    gb.onclick=()=>{location.href=o.href;};}
  else{gb.classList.add('soon');gt.textContent=(o.go||'待定')+' · 还没做';gb.onclick=null;}
  sheet.classList.add('open');
}
function closeSheet(){sheet.classList.remove('open');}

/* ═══════════════════════════════════════════════════════ 交互 */
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.getElementById('sh-x').onclick=e=>{e.stopPropagation();closeSheet();};
document.getElementById('btn-hints').onclick=e=>{
  document.body.classList.toggle('hints');
  e.currentTarget.classList.toggle('on',document.body.classList.contains('hints'));
  if(document.body.classList.contains('hints')) drawHintBoxes(); else hots.innerHTML='';
  toast(document.body.classList.contains('hints')?'已显示可点击区域':'已隐藏可点击区域');
};
/* ★ 2026-10-23（用户要求）：默认进【会客室】（walk.html 不带 ?theme= 时就是 basicRoom）；
   走廊 hub.html 作为早期构造保留，去不去由访客自己决定（房间面板底部有「回走廊」）。 */
document.getElementById('btn-3d').onclick=()=>{location.href='walk.html';};
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')  go(cur-1);
  if(e.key==='ArrowRight') go(cur+1);
  if(e.key==='Escape')     closeSheet();
  if(e.key==='h'||e.key==='H') document.getElementById('btn-hints').click();
});

/* ★ 像素级拾取：鼠标移动 → 采样遮罩 */
const stageEl = document.getElementById('stage');
let rafPick = 0, lastEvt = null;
stageEl.addEventListener('mousemove', e=>{
  lastEvt = e;
  if(rafPick) return;
  rafPick = requestAnimationFrame(()=>{
    rafPick = 0;
    if(!lastEvt) return;
    setHover(pickByMask(lastEvt.clientX, lastEvt.clientY));
  });
}, {passive:true});
stageEl.addEventListener('mouseleave', ()=>setHover(null));

/* 点击：用同样的遮罩判定 */
let downPt = null;
stageEl.addEventListener('pointerdown', e=>{ downPt=[e.clientX,e.clientY]; });
stageEl.addEventListener('pointerup', e=>{
  if(!downPt) return;
  const moved = Math.hypot(e.clientX-downPt[0], e.clientY-downPt[1]);
  downPt = null;
  if(moved > 6) return;                       // 拖拽不算点击
  const key = pickByMask(e.clientX, e.clientY);
  if(key && OBJECTS[key]) openSheet(key);
  else closeSheet();
});

/* 调试：画出所有可点击物件的包围盒 */
function drawHintBoxes(){
  hots.innerHTML='';
  const v = META.views[curViewId]; if(!v) return;
  Object.entries(v.rects)
    .filter(([g,r])=>OBJECTS[g] && r.visible_ratio>=0.45 && (r.width*r.height)>=1.5)
    .forEach(([g,r])=>{
      const el=document.createElement('div');
      el.className='hot';
      el.style.left=r.left+'%'; el.style.top=r.top+'%';
      el.style.width=r.width+'%'; el.style.height=r.height+'%';
      hots.appendChild(el);
    });
}

let tx0=0,ty0=0;
addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.6) go(cur+(dx<0?1:-1));
},{passive:true});

addEventListener('resize',updatePan);
</script>
