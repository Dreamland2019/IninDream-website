<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>宿舍走廊 · IninDream</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0d12;
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#dfe8f4;-webkit-user-select:none;user-select:none}
  canvas{display:block}

  /* ── 开始页 ★ 2026-10-11 改：向 walk.html 的提示页看齐（原来只有标题 + 一行小字，
     信息太少）。用户要求"把宿舍那套提示替换走廊的提示"，并且【只触发一次】
     —— 从宿舍按 E 回走廊不再重复弹（见 body 开头的内联脚本 + 下面的 JS）。 */
  #start{position:fixed;inset:0;z-index:60;cursor:pointer;
    background:radial-gradient(circle at 50% 45%,#101a26,#05070b 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    transition:opacity .5s ease}
  #start.gone{opacity:0;pointer-events:none}
  /* ★ 已看过提示的访客：一开始就不显示（靠 <html> 上的标记，避免闪一下） */
  html.hub-seen #start{opacity:0;pointer-events:none}
  #start h2{font-size:20px;font-weight:600;letter-spacing:.3em;color:#e8f1fb}
  #start .sub{font-size:11.5px;color:#7c8fa6;letter-spacing:.16em;line-height:2;text-align:center}
  #start .sub b{color:#cfe0f2;font-weight:500}
  #startbtn{margin-top:6px;border:1px solid rgba(95,216,232,.5);border-radius:3px;
    padding:11px 26px;font-size:12.5px;letter-spacing:.18em;color:#5fd8e8;
    background:rgba(95,216,232,.09);transition:background .2s,transform .2s;cursor:pointer}
  #start:hover #startbtn{background:rgba(95,216,232,.2);transform:scale(1.03)}
  #startbtn.waiting{opacity:.45;cursor:wait;border-color:rgba(120,200,220,.25);
    color:#7c8fa6;background:transparent}
  #start .keys{display:flex;gap:20px;margin-top:10px;font-size:11px;color:#7c8fa6;
    flex-wrap:wrap;justify-content:center}
  #start .keys span b{color:#dfe8f4;font-weight:500;border:1px solid #33465c;
    border-radius:2px;padding:1px 6px;background:rgba(120,200,220,.08)}
  /* ★ 性能提示（和 walk.html 一致：卡顿时先查硬件加速） */
  #start .perfnote{margin-top:22px;max-width:420px;text-align:center;
    border-top:1px solid rgba(120,200,220,.14);padding-top:16px}
  #start .pn-title{font-size:10.5px;letter-spacing:.2em;color:#7c8fa6;margin-bottom:9px}
  #start .pn-body{font-size:11px;line-height:2;color:#7c8fa6}
  #start .pn-body b{color:#5fd8e8;font-weight:600}
  #start .pn-path{font-size:10px;color:#5c7086}

  /* ── HUD */
  #hud{position:fixed;inset:0;z-index:20;pointer-events:none}
  #cross{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;
    border-radius:50%;background:rgba(220,235,250,.5);
    box-shadow:0 0 0 1px rgba(0,0,0,.45)}
  #exitbtn{position:absolute;right:16px;top:16px;pointer-events:auto;
    padding:8px 16px;border:1px solid #33465c;border-radius:3px;
    background:rgba(18,24,33,.78);color:#a9bed4;font-size:12.5px;
    letter-spacing:.1em;cursor:pointer;text-decoration:none}
  #exitbtn:hover{background:rgba(30,42,56,.9);color:#e2eefb}
  #keyhelp{position:absolute;left:16px;bottom:14px;font-size:12px;line-height:1.85;
    color:#7d90a6;text-shadow:0 1px 3px #000}
  #keyhelp b{color:#b9cee4;font-weight:600}
  #fps{position:absolute;right:16px;bottom:14px;font-size:11.5px;color:#5f7288;
    font-family:Consolas,monospace;text-align:right;line-height:1.7}

  /* ── 互动提示 */
  #prompt{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);
    padding:12px 26px;border:1px solid #4a6a8c;border-radius:3px;
    background:rgba(14,20,28,.9);font-size:14px;letter-spacing:.1em;
    color:#dceaf8;opacity:0;transition:opacity .18s ease;white-space:nowrap}
  #prompt.on{opacity:1}
  #prompt .k{display:inline-block;margin-right:9px;padding:1px 8px;
    border:1px solid #6d90b4;border-radius:2px;background:#1d2a38;
    color:#a8d4f0;font-weight:600;font-size:13px}
  #prompt .n{color:#8fb6d8}

  /* ── 淡入淡出（切场景用） */
  #fade{position:fixed;inset:0;z-index:50;background:#05070a;
    opacity:0;pointer-events:none;transition:opacity .32s ease}
  #fade.on{opacity:1}

  #bootError{position:fixed;inset:0;z-index:99;display:none;
    align-items:center;justify-content:center;padding:30px;
    background:#0a0d12;color:#ffb4b4;font-size:13px;line-height:1.9;
    white-space:pre-wrap;text-align:left}

  #loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:55;font-size:13px;color:#7c8fa6;letter-spacing:.16em}

  /* ── 手机端（2026-10-14 加）──────────────────────────────────────────────
     用户："你把走廊的手机端支持加上。"
     ★ 走廊原来【完全没有】触摸支持：没有摇杆、没有拖拽转头 —— 手机上根本走不动。
     现在补齐四件事：① 摇杆移动　② 拖拽屏幕转头　③ 点提示框 = 按 E 进门
     ④ 右下角房间列表按钮（Tab 的等价物）。
     ★ 实现照搬 walk.html 那套（两边保持一致，改一处记得改另一处）。 */
  #stick{display:none}
  #roombtn{display:none}
  #touchhelp{display:none}

  @media (pointer: coarse), (max-width:820px){
    #keyhelp{display:none}

    /* 触摸操作提示（几秒后淡出） */
    #touchhelp{display:flex;position:fixed;left:50%;top:48px;transform:translateX(-50%);
      z-index:23;gap:13px;font-size:10.5px;color:#7d90a6;letter-spacing:.08em;
      background:rgba(11,17,26,.85);border:1px solid #24313f;border-radius:3px;
      padding:6px 12px;white-space:nowrap;transition:opacity .6s;pointer-events:none}
    #touchhelp.fade{opacity:0}
    #touchhelp b{color:#5fd8e8;font-weight:600}

    /* 摇杆 */
    #stick{display:block;position:fixed;left:18px;bottom:78px;z-index:25;
      width:92px;height:92px;border-radius:50%;
      border:1.5px solid rgba(120,200,220,.28);background:rgba(8,13,21,.42);
      touch-action:none}
    #stick i{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;
      border-radius:50%;background:rgba(95,216,232,.32);border:1.5px solid rgba(95,216,232,.7);
      box-shadow:0 0 18px rgba(95,216,232,.35)}

    /* 房间列表（Tab 的等价物）：左下摇杆、右下这个，对称。
       ⚠️ 文字不用 emoji —— 🚪 在无头 Edge 里会渲染成橙色方块（字体缺失），
          真机大概率没事但不值得赌，直接用中文。 */
    #roombtn{display:flex;position:fixed;right:18px;bottom:78px;z-index:26;
      width:66px;height:66px;border-radius:50%;border:1.5px solid rgba(120,200,220,.45);
      background:rgba(11,17,26,.78);color:#9fe8ff;font-size:13px;line-height:1.2;
      letter-spacing:.06em;
      align-items:center;justify-content:center;padding:0;cursor:pointer;font-family:inherit;
      touch-action:manipulation;-webkit-user-select:none;user-select:none}
    #roombtn:active{background:rgba(95,216,232,.3);border-color:rgba(95,216,232,.9)}

    /* ★ 提示框可点 = 按 E 进门（手机上没键盘，这是唯一的进门方式） */
    #prompt{bottom:32%;padding:14px 22px;font-size:15px;cursor:pointer}
    #prompt:active{background:rgba(30,45,62,.95);border-color:#7fb4dc}
    /* ★ 2026-10-14 用户："手机端的提示应该删除'按E''E'这些字符，只留下'推门出去''进入xxx'"
       ⇒ 那个「E」小方块（class="k"）在手机端不显示，只留「进入 圣马尔索校内教室」。
         房间页 walk.html 的提示框同理（那边 class 叫 "pk"）。 */
    #prompt .k{display:none}

    #fps{right:14px;bottom:12px;font-size:10.5px}
  }
</style>
</head>

<script>
/* ★★★ 2026-10-11：已看过走廊提示的访客 —— 提前给 <html> 打标记，
   让 #start 一开始就不显示。必须放在 #start 渲染【之前】，

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/GLTFLoader.js';
// ★★★ 2026-10-13：房间清单改成【单一数据源】—— 加房间只改 rooms/manifest.js
import { hubSlots, hasRigBackup, ROOMS } from './rooms/manifest.js';
// ★★★ 2026-10-13（用户需求 2）：走廊里也能按 Tab 唤起【同一个】房间选择面板。
//   为什么走廊也要有：用户说"以后要加很多宿舍，走廊做很长不太现实，
//   我打算走廊的 6 间只放我个人比较喜欢的" —— 也就是走廊只当"精选橱窗"，
//   剩下没门的房间【只能从这个面板进】。面板本体与 walk.html 共用 rooms/panel.js。
import { openRoomPanel as showRoomPanel, closeRoomPanel as hideRoomPanel,
         isRoomPanelOpen, panelKey as sharedPanelKey } from './rooms/panel.js';

// ══════════════════════════════════════════════════ 兜底错误提示
function showFatal(msg, detail){
  const el = document.getElementById('bootError');
  if (!el) return;
  el.style.display = 'flex';
  el.textContent = '出错了：' + msg + (detail ? '\n\n' + detail : '');
  const l = document.getElementById('loading'); if (l) l.style.display = 'none';
}
window.addEventListener('error', e => showFatal(e.message || '未知脚本错误'));
window.addEventListener('unhandledrejection', e => showFatal('Promise 未处理', String(e.reason)));

// ══════════════════════════════════════════════════ 走廊参数
// Blender 坐标 → glTF：  (x,y,z) → (x, z, -y)
//   长 0~10.80  → three.js X  0 ~ 10.80
//   宽 -1.30~1.30（Blender Y）→ three.js Z  +1.30 ~ -1.30
//   高 0~2.70（Blender Z）  → three.js Y  0 ~ 2.70
const COR = {
  x0: 0.0, x1: 10.80,
  z0: -1.30, z1: 1.30,
  y0: 0.0,  y1: 2.70,
};
const WALLPAD = 0.34;
const BOUND = {
  x0: COR.x0 + 0.45, x1: COR.x1 - 0.45,
  z0: COR.z0 + WALLPAD, z1: COR.z1 - WALLPAD,
};
const EYE = 1.52;
const RADIUS = 0.22;

// 门：3 个模块，每模块左右各一扇
// 模块 i 的起点 x = i*3.6；门宽 1.29，门洞从 1.155 到 2.445，中心 1.8
const MOD = 3.60, DOOR_W = 1.29;
const DOORS = [];
for (let i = 0; i < 3; i++){
  const cx = i * MOD + (MOD - DOOR_W) / 2 + DOOR_W / 2;
  // 左墙（Blender Y=-1.30 → three.js Z=+1.30）
  DOORS.push({ x:cx, z: COR.z1, side:'L', idx:DOORS.length });
  // 右墙（Blender Y=+1.30 → three.js Z=-1.30）
  DOORS.push({ x:cx, z: COR.z0, side:'R', idx:DOORS.length });
}

// ★ 门 → 主题
//   ★★★ 2026-10-13：这张表【搬进了 `rooms/manifest.js`】—— 加房间只改那一个文件，
//     别在这里再手写第二份（原来 walk.html 的面板列表也是手抄的，两份一定会不同步）。
//     这里只负责"把清单里 inHub 的那几间，按顺序铺到走廊的 6 个门位上"。
//     · 顺序 = DOORS 的顺序：左0 → 右0 → 左1 → 右1 → 左2 → 右2
//     · 不足 6 个时补空门位（theme:''）→ checkDoors / tryEnter 会跳过它们
//     · 预览图路径约定：./assets/previews/<主题>.png
const DOOR_THEME = hubSlots();

// ══════════════════════════════════════════════════ ★ 尽头第 7 扇门：会客室
/* 2026-10-13 新增（依据交接文档《新窗口提示词-会客室终端与走廊连接.md》任务 A）
   ─────────────────────────────────────────────────────────────────────────
   为什么【不进 DOORS 数组】：DOORS 是按"3 模块 × 左右各一"算 x 的，
   尽头这扇塞进去会让 DOOR_THEME 的下标与侧墙门全部错位 → 单独一条。

   ★★★ 用户 2026-10-13 拍板（重要，别再改）：
     走廊尽头 HUB_partition 的贴图【本身就是一扇门的画】
     （实测 252×248：一张"门框 + 门后深色空间"的透视贴图）。既然整张图就是门：
       · 在它上面再开一个门洞 = 在一张门的画上挖洞 → 怪
       · 在它上面挂门牌        = 把门本身盖住     → 怪
     ⇒ 所以【不开洞、不挂门牌】，只用【地面发光导引贴片】指路。
        进门 = 走到隔断前按 E（见 tryEnter 的"向前推进"处理）。

   几何实测（3D渲染\tools\_fk_probe_hub_glb.cjs 读 hub.glb）：
     HUB_partition  X=10.780（厚度 0）Y 0~2.70  Z ±1.250   材质自带发光(emissive=1.1)
     HUB_end_b      X 10.820~11.100   Y 0~2.70  Z ±1.300   ← 被隔断完全挡住的真尽头墙
   ★ 尽头是【一堵实墙】：它顶到天花板，所以没有"门上方那道 0.55 m 的墙"可利用
     （现有 6 块门牌就贴在那道墙上），这也从几何上排除了"挂门牌"这条路。 */
const END_DOOR = {
  theme: 'basicRoom',
  name:  '会客室',
  // ★ 官方文案：building_data.json → customData.themes['furniM_set_basicRoom']（逐字抄）
  desc:  '为了营造良好的会客环境，提升业务洽谈成功率，罗德岛准备重新装修一遍会客室。可露希尔向你提交了一张财务报表，详细描述了此次装修的规划设计，并要走了一笔经费。',
  /* pic：★ 会客室【没有】游戏原版那块 480×296 的门牌图 —— 2026-10-13 实测确认：
       主题 furniM_set_basicRoom 的家具只存在于
         building\diy\prefabs\furnitures\furnim_basicroom\
       而现有 6 块门牌图那套来自
         arts\shop\furngroup\<组>_<年>\<组>_<年>_1.png
       ★ 会客室【根本不在 arts\shop\furngroup 里】（全盘搜 basicroom 只有 building\diy
         那两条命中）—— 它是【基建功能房】，不是商店家具套装，所以压根没出过商店预览图。
       ⚠️⚠️ 别拿 arts\shop\furngroup\receptionroom_2026\ 去凑：那间门牌上写着
         「天镜阁会客堂」，是中式另一个套装，和这间冷白会客室完全不是一回事
         （我第一版就是这么拷的，看图才发现，已删）。
       反正用户已拍板【尽头不挂门牌】，这里就留 null；以后真要这块图，得另想办法出。
       （交接文档的"第 1 步：给会客室做门牌图"这一步的前提是错的，已作废。） */
  pic:   null,
  x: 10.78,                          // = HUB_partition 所在平面
  z0: -1.25, z1: 1.25,               // 隔断的 Z 跨度
  /* ★ 入门判定：站在尽头这一小片区域里就算"在会客室门前"。
     ─────────────────────────────────────────────────────────────────────────
     trigX 为什么取 9.82（而不是拍一个 9.x 的整数）：这是【算出来】的，不是估的。
     侧墙门 L2/R2 在 x=9.0、z=±1.30，判定半径 1.55。站在走廊正中(z=0)时，
       到 L2 的距离 = hypot(x-9.0, 1.30) < 1.55  →  (x-9.0)² < 0.7125  →  x < 9.844
     也就是说【中线走到 9.844 之后就不再触发侧墙门】。
     取 9.82 略小于 9.844：
       · 两套判定有 0.024 m 的重叠 → 中间【不会出现"什么都不提示"的空档】(重叠处尽头门优先)
       · 走到 9.82 时提示恰好从"侧墙那间"切到"会客室"，不会来回跳
     ★ |z| < 1.2 这一半沿用交接文档给的值（隔断 Z 跨度 ±1.25，站它正面）。 */
  trigX: 9.82, trigHalfZ: 1.20,
  /* ★ 从会客室出门时：人落在隔断前 0.88 m，面朝隔断。
     9.90 = 已进尽头区（> 9.82）→ 一出来提示就是「E 进入 会客室」；
     同时到 L2 门的距离 1.58 m > 1.55 → 侧墙门这里根本不会抢提示。 */
  spawnX: 9.90,
  // ★ 地面导引贴片（用户拍板的方案）。w = 横向(Z)、h = 纵向(X)
  /* cx 为什么是 9.35（不是 9.55）：地面文字要能【边走边读】。
     实测仰角：视线 1.52 m、垂直 FOV 74°，走路时低头约 0.30 rad →
       画面下边缘落在前方 d = 1.52/tan(0.30+0.646) ≈ 1.10 m 处。
     cx=9.55 时文字在 X≈8.84（离人只有 0.5~0.8 m）→ 一直被压在画面外，白画。
     cx=9.35 时文字落在 X≈8.70、三个箭头 9.28/9.64/10.00 →
       人走到 X≈7.3 时【文字 + 三个箭头全在视野里】（实测截图确认），
       再往前走文字滑到脚下，箭头继续指着隔断。 */
  guide: { cx: 9.35, cz: 0.0, w: 1.50, h: 1.90, y: 0.012 },
};

/* ★ 2026-10-13：`?from=<主题>` —— 从房间里按 E 出来时带上的来源。
   决策 3：出门要【回到走廊里自己那扇门前】，而不是永远回走廊出生点。
   这是通用逻辑：7 扇门都吃（末尾的会客室 + 6 扇侧墙门）。
   ★★ 2026-10-13 用户修正（重要）：**朝向要背对门、面朝走廊**。
      用户原话："从会客室离开后，视角应该朝向走廊，而非门。同样的，从宿舍到走廊时，
      视角不应该朝向门，而应该朝向门的反方向，即有出门的感觉，朝向门不合常理"。
      所以下面的 yaw 全是"背对那扇门"：
        hub.html 里"前方 = (-sin yaw, -cos yaw)"
          L 门（墙在 z=+1.30）→ 背对门 = 朝 -Z → yaw = 0
          R 门（墙在 z=-1.30）→ 背对门 = 朝 +Z → yaw = π
          尽头门（隔断在 x=+10.78）→ 背对门 = 朝 -X → yaw = π/2
      （第一版写的是"面朝自己的门"，观感是"一出门就盯着门看"，确实不合常理。） */
function hubSpawnFrom(theme){
  if (!theme) return null;
  if (theme === END_DOOR.theme){
    return { x: END_DOOR.spawnX, z: 0, yaw: Math.PI / 2 };   // 背对隔断 → 朝走廊（-X）
  }
  const i = DOOR_THEME.findIndex(t => t.theme === theme);
  if (i < 0) return null;                                     // 不认识的主题 → 用默认出生点
  const d = DOORS[i];
  // 站到自己那扇门前 0.90 m（墙在 z=±1.30，往走廊里内缩），然后【转身面朝走廊】
  return { x: d.x, z: d.z > 0 ? (d.z - 0.90) : (d.z + 0.90), yaw: d.z > 0 ? 0 : Math.PI };
}
const FROM_THEME = (() => {
  try { return new URLSearchParams(location.search).get('from') || ''; } catch (e) { return ''; }
})();
/* ★ 走廊也把 mode 带下去（rig 回退时别丢）。
   ⚠️ 但只有 `rooms\_rig\` 里真有备份的主题才能带 —— 否则会拼出 404 的 URL。
      "有没有 rig 版"现在由 `rooms/manifest.js` 的 hasRig 字段说了算（单一数据源）。 */

})();

const QUALITY = [

  { name:'中', pr:() => Math.min(devicePixelRatio, 1.25), aniso:4 },

];
let qualityIdx = 0;
const PR_MAX = QUALITY[0].pr();       // ★ 上限（自适应降分辨率时用）

// ══════════════════════════════════════════════════ 载入走廊模型
const matCache = new Map();
const allTextures = [];
const _frameByDoor = {};      // ★ 门框白边：按 "L0"/"R0" 分组，靠近才点亮
let partitionMat = null;      // ★ 尽头隔断的材质句柄（checkDoors 里做"靠近提亮"；载入回调里赋值）

function toLambert(src){
  const key = [ src.name, src.map?src.map.uuid:'-', src.emissive?src.emissive.getHexString():'-',
    src.emissiveMap?src.emissiveMap.uuid:'-', src.transparent, src.opacity, src.alphaTest, src.side ].join('|');
  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshLambertMaterial({
    map: src.map || null,
    color: src.color ? src.color.clone() : new THREE.Color(0xffffff),
    emissive: src.emissive ? src.emissive.clone() : new THREE.Color(0x000000),
    emissiveMap: src.emissiveMap || null,
    emissiveIntensity: src.emissiveIntensity != null ? src.emissiveIntensity : 1,
    transparent: !!src.transparent,
    opacity: src.opacity != null ? src.opacity : 1,
    alphaTest: src.alphaTest || 0,
    side: src.side,
    depthWrite: src.depthWrite !== false,
  });
  m.name = 'LMB_' + (src.name || 'mat');
  matCache.set(key, m);
  return m;
}

// 门的发光面要亮一点：给自发光材质提亮
new GLTFLoader().load('./hub.glb', gltf => {
  const root = gltf.scene;
  root.traverse(o => {
    if (!o.isMesh) return;
    if (Array.isArray(o.material)) o.material = o.material.map(toLambert);
    else if (o.material) o.material = toLambert(o.material);

    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats){
      if (m && m.map){
        m.map.magFilter = THREE.NearestFilter;
        m.map.minFilter = THREE.LinearMipmapLinearFilter;
        m.map.generateMipmaps = true;
        m.map.anisotropy = QUALITY[qualityIdx].aniso;
        m.map.needsUpdate = true;
        if (!allTextures.includes(m.map)) allTextures.push(m.map);
      }
      // ★ 荧光灯 / 尽头隔断：自发光提亮，让它真的"发光"
      const nm = o.name.toLowerCase();
      if (nm.includes('lamp') || nm.includes('partition')){
        m.emissive = new THREE.Color(0xdcebff);
        m.emissiveIntensity = nm.includes('lamp') ? 2.4 : 1.1;
        if (m.map) m.emissiveMap = m.map;
      }
      // ★ 门框白边：平时不亮，靠近才点亮
      //   每个门要独立材质，不然一扇亮全部跟着亮
      if (nm.includes('dframe')){
        o.material = m.clone();
        o.material.emissive = new THREE.Color(0xa8d8ff);
        o.material.emissiveIntensity = 0;
        o.material.toneMapped = false;
        const mm = o.name.match(/dframe_([LR])_(\d+)/);
        if (mm) (_frameByDoor[mm[1] + mm[2]] = _frameByDoor[mm[1] + mm[2]] || []).push(o);
      }
    }
    o.frustumCulled = true;
  });
  scene.add(root);
  loaded = true;

  // ★ 尽头隔断的材质句柄（checkDoors 里做"靠近提亮"，替代它没有的门框白边）
  const partObj = root.getObjectByName('HUB_partition');
  if (partObj && partObj.material) partitionMat = partObj.material;

  // ★★★ 门牌（门票）：把主题预览图贴在每扇门上方
  //     尺寸按门上方那块墙定：门高 2.15，层高 2.70 → 只有 0.55 米高
  (function buildDoorPlates(){
    const tl = new THREE.TextureLoader();
    for (let i = 0; i < DOORS.length; i++){
      const t = DOOR_THEME[i];
      if (!t.theme) continue;
      const d = DOORS[i];
      tl.load(t.pic, tex => {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.generateMipmaps = true;
        const PW = 0.92, PH = 0.42;            // 门票尺寸（宽 × 高）
        // 白色边框（先建，门票贴在上面）
        const frameMat = new THREE.MeshBasicMaterial({ color: 0xdfeaf5, toneMapped: false, side: THREE.DoubleSide });
        const frame = new THREE.Mesh(new THREE.PlaneGeometry(PW + 0.05, PH + 0.05), frameMat);
        const plate = new THREE.Mesh(
          new THREE.PlaneGeometry(PW, PH),
          new THREE.MeshBasicMaterial({ map: tex, toneMapped: false, side: THREE.DoubleSide })
        );
        const y = 2.15 + 0.30;                 // 门顶 2.15，往上 0.30
        // ★ 墙的内表面在 ±1.25（墙心 ±1.30，墙厚 0.10）
        //   偏移必须 ≥ 0.06，否则门牌埋进墙里看不见
        const inward = d.z > 0 ? -1 : 1;
        for (const [m, off] of [[frame, 0.075], [plate, 0.080]]){
          m.position.set(d.x, y, d.z + inward * off);
          m.rotation.y = d.z > 0 ? Math.PI : 0;
          m.renderOrder = 3;
          scene.add(m);
        }
        console.log('%c★ 门牌已挂：%s', 'color:#5fd8e8', t.name);
      }, undefined, () => console.warn('门牌图载入失败：' + t.pic));
    }
  })();

  document.getElementById('loading').style.display = 'none';
  const btn = document.getElementById('startbtn');
  btn.textContent = '点击进入';
  btn.classList.remove('waiting');
  console.log('%c★ 走廊载入完成，共 %d 个材质', 'color:#5fd8e8;font-weight:bold', matCache.size);
}, undefined, err => {
  console.error(err);
  document.getElementById('loading').style.display = 'none';
  const btn = document.getElementById('startbtn');
  btn.textContent = '模型载入失败';
  showFatal('hub.glb 载入失败', String(err && err.message || err));
});

// ══════════════════════════════════════════════════ ★ 地面发光导引贴片（会客室）
/* 2026-10-13 新增 —— 用户 2026-10-13 原话拍板的就是【这个方案】：
     "走廊尽头的游戏内隔断贴图本身就是一个门的贴图，继续在上面开门显得过于奇怪，
      由于整个贴图都是门，挂门牌也显得奇怪，所以我才选择在地上画箭头指引。"
   ⇒ 所以本函数只画地面，隔断的几何【一个顶点都不动】。

   贴片内容 = 箭头（指向 X+ 的隔断）+ 文字「会客室」（用户拍板的方案 C）。
   ★ "发光"怎么来：走廊【没有 Bloom 合成器】（renderer 直出渲染）→ 别指望泛光洇出来，
     靠的是"纯亮色 + toneMapped:false"，外加 canvas 里画的 shadowBlur 光晕（烘焙进贴图）。
   ★ 颜色为什么用【冷白】而不是"金"：
     交接文档里写的"会客室的金白调（呼应 clmsRoom 那套）"把两个房间搞混了 ——
     clmsRoom 是【港都会客室】(金)，basicRoom 是【会客室】(冷白，房间自带 HUD 写着
     "RECEPTION ROOM"，实测截图是亮白接待室)。走廊是暗蓝工业光 → 一道【白得发亮】的
     箭头本身就是"那个方向是亮房间"的暗示，这才是对的视觉钩子。 */
function buildEndGuide(){
  const G = END_DOOR.guide;
  const CV_W = 600, CV_H = 760;         // 画布比例 = 贴片 1.50 m(横向 Z) : 1.90 m(纵向 X)
  const cv = document.createElement('canvas');
  cv.width = CV_W; cv.height = CV_H;
  const g = cv.getContext('2d');
  if (!g) return;

  const rr = (x, y, w, h, r) => {       // roundRect 兜底（老 Edge 没有 ctx.roundRect）
    g.beginPath();
    if (g.roundRect){ g.roundRect(x, y, w, h, r); return; }
    g.moveTo(x + r, y);
    g.arcTo(x + w, y,     x + w, y + h, r);
    g.arcTo(x + w, y + h, x,     y + h, r);
    g.arcTo(x,     y + h, x,     y,     r);
    g.arcTo(x,     y,     x + w, y,     r);
    g.closePath();
  };

  g.clearRect(0, 0, CV_W, CV_H);
  // ① 一块很淡的深色"牌子"底：保证压到地面花纹/黄色警示条上也照样读得出来
  g.fillStyle = 'rgba(6,12,18,0.42)';
  rr(10, 10, CV_W - 20, CV_H - 20, 30); g.fill();
  // ② 白边框 —— 和走廊现有 6 块门牌（白边框 + 内容）保持同一套视觉语言
  g.strokeStyle = 'rgba(223,234,245,0.60)'; g.lineWidth = 4;
  rr(22, 22, CV_W - 44, CV_H - 44, 22); g.stroke();

  const INK  = '#eaf6ff';                      // 会客室的"白"
  const HALO = 'rgba(140,208,255,0.90)';       // 冷青钩子

  /* ③ 箭头：三个 chevron，全部指向 canvas 的【上】
     ── 方向为什么是"上"：贴片整体绕世界 Y 轴转了 -90°（见下面 mesh 的摆法），于是
          canvas 的"右" = 玩家的右手(+Z)、canvas 的"上" = 玩家的正前方(+X)。
        ⇒ "画布朝上"就是"指着隔断"，而文字还能【正常横着写】、低头就能读。
        （只写 rotation.x = -π/2 的话，文字会躺在走廊方向上、从正面看是竖着的。） */
  g.save();
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = INK; g.shadowColor = HALO;
  const CW = 126, CH = 62;                     // chevron 半宽 / 半高
  for (let i = 0; i < 3; i++){
    const cy = 410 - i * 145;                  // i=0 在最下面（离人最近），i=2 最靠门
    g.lineWidth  = (i === 2) ? 40 : 34;        // 最靠门那个略粗 → 有递进感
    g.shadowBlur = (i === 2) ? 34 : 22;
    g.beginPath();
    g.moveTo(CV_W / 2 - CW, cy + CH);
    g.lineTo(CV_W / 2,      cy - CH);
    g.lineTo(CV_W / 2 + CW, cy + CH);
    g.stroke();
  }
  g.restore();

  // ④ 文字「会客室」（横着写：canvas 右 = 玩家右手），放在靠人的那一端
  g.save();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = INK; g.shadowColor = HALO; g.shadowBlur = 26;
  g.font = '600 96px "HarmonyOS Sans SC","Microsoft YaHei","PingFang SC",sans-serif';
  g.fillText('会客室', CV_W / 2, 640);
  // ⑤ 一行小字，呼应房间自己的 HUD（"RECEPTION ROOM FIRST PERSON"）
  g.shadowBlur = 12;
  g.fillStyle = 'rgba(200,228,248,0.72)';
  g.font = '500 26px Consolas,ui-monospace,monospace';
  try { g.letterSpacing = '7px'; } catch (e) {}
  g.fillText('RECEPTION ROOM', CV_W / 2, 712);
  g.restore();

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = QUALITY[qualityIdx].aniso;
  tex.minFilter  = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  allTextures.push(tex);                       // ★ 跟着 Q 键切画质一起改各向异性

  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent: true, toneMapped: false,   // ★ 不受曝光影响（renderer 已是 NoToneMapping）
    depthWrite: false, side: THREE.DoubleSide,
    // ★ Y 抬 0.012 + polygonOffset 双保险，防和地面 z-fighting（项目已知坑 #8）
    polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(G.w, G.h), mat);
  /* ★ 摆法两步（别省第二步）：
       ① rotation.x = -π/2  →  放平（贴片法线朝上 +Y）
       ② 再绕【世界 Y 轴】转 -90°  →  canvas 右 = 世界 +Z、canvas 上 = 世界 +X
     第二步就是"文字能横着读"的关键，理由见上面 ③ 的注释。 */
  mesh.rotation.set(-Math.PI / 2, 0, 0);
  mesh.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), -Math.PI / 2);
  mesh.position.set(G.cx, G.y, G.cz);
  mesh.renderOrder = 4;
  scene.add(mesh);
  console.log('%c★ 会客室地面导引贴片已放：X %s（%s ~ %s）　Z ±%s　Y=%s',
    'color:#5fd8e8;font-weight:bold',
    G.cx.toFixed(2), (G.cx - G.h / 2).toFixed(2), (G.cx + G.h / 2).toFixed(2),
    (G.w / 2).toFixed(2), G.y);
}
buildEndGuide();

/* ══════════════════════════════════════════════════ ★ 房间选择面板（Tab）
   ★ 用户需求 2："无论在何地都可以唤起终端页面" —— 走廊也算"何地"。
     走廊只放精选 6 间（manifest 的 inHub），其余房间只能从这里进。 */
function openHubRoomPanel(){
  if (isRoomPanelOpen()) return;
  // ★ 面板要能用鼠标点 → 先解锁（走廊的锁逻辑在 pointerlockchange 里，
  //   丢锁只会把 running 置 false，而重新上锁时会恢复 —— 那段 2026-10-13 刚修过，别动）
  try { if (document.pointerLockElement) document.exitPointerLock(); } catch (e) {}
  for (const k in keys) keys[k] = false;          // 别让"按着 W 开面板"变成松手还在走
  const el = document.getElementById('prompt');
  if (el) el.classList.remove('on');
  showRoomPanel({
    title: '房 间 选 择',
    // 走廊自己不是"房间"，所以列全部房间（含会客室）
    rooms: ROOMS.filter(r => r.theme).map(r => ({ theme: r.theme, name: r.name, desc: r.desc })),
    onPick: (theme) => {
      // ★ 走的是和 tryEnter() 完全一样的 URL 规则（含 mode 转发），别自己拼第二套
      let url = './walk.html?theme=' + encodeURIComponent(theme) + '&from=hub';
      if (HUB_MODE && hasRigBackup(theme)) url += '&mode=' + encodeURIComponent(HUB_MODE);
      const fade = document.getElementById('fade');
      if (fade) fade.classList.add('on');
      setTimeout(() => { location.href = url; }, 340);
    },
    // 人已经在走廊里了 → 不显示"回走廊"按钮
    onClose: () => { for (const k in keys) keys[k] = false; },
  });
}

// 鼠标视角
document.addEventListener('mousemove', e => {
  if (!locked) return;
  player.yaw   -= e.movementX * 0.0022;

// ══════════════════════════════════════════════════ 手机端触摸（2026-10-14 加）
/* 用户："你把走廊的手机端支持加上。"
   ★ 走廊原来【完全没有】触摸支持 —— 手机上既没有摇杆也没有拖拽转头，根本走不动。
   这一段是**照搬 walk.html** 的实现（两边保持一致，以后改一处记得改另一处）：
     ① #stick 虚拟摇杆 → 写进 stick.x / stick.y，再由 animate() 里的移动块消费
     ② 在 canvas 上拖动 → 直接改 player.yaw / pitch
     ③ 点提示框 → 等价于按 E 进门
     ④ #roombtn → 等价于按 Tab 开房间列表 */
const isTouch = matchMedia('(pointer: coarse)').matches;

const stickEl = document.getElementById('stick');
const stickKnob = stickEl ? stickEl.querySelector('i') : null;
const stick = { x:0, y:0, id:null, cx:0, cy:0 };
function stickStart(e){
  const t = e.changedTouches ? e.changedTouches[0] : e;
  const r = stickEl.getBoundingClientRect();
  stick.id = (t.identifier !== undefined) ? t.identifier : 'mouse';
  stick.cx = r.left + r.width/2; stick.cy = r.top + r.height/2;
  stickMove(e);
}
function stickMove(e){
  if (stick.id === null) return;
  let t = null;
  if (e.changedTouches){
    for (const c of e.touches) if (((c.identifier !== undefined) ? c.identifier : 'mouse') === stick.id) t = c;
    if (!t) return;
  } else t = e;
  let dx = t.clientX - stick.cx, dy = t.clientY - stick.cy;
  const max = 44;
  const len = Math.hypot(dx, dy) || 1;
  const k = Math.min(1, len / max);
  dx = dx/len*k; dy = dy/len*k;
  stick.x = dx; stick.y = dy;
  if (stickKnob) stickKnob.style.transform = 'translate(' + (dx*max) + 'px, ' + (dy*max) + 'px)';
}
function stickEnd(e){
  if (e && e.changedTouches){
    let found = false;
    for (const c of e.touches) if (((c.identifier !== undefined) ? c.identifier : 'mouse') === stick.id) found = true;
    if (found) return;
  }
  stick.id = null; stick.x = 0; stick.y = 0;
  if (stickKnob) stickKnob.style.transform = 'translate(0,0)';
}
if (stickEl){
  stickEl.addEventListener('touchstart', e=>{e.preventDefault();stickStart(e);}, {passive:false});
  stickEl.addEventListener('touchmove',  e=>{e.preventDefault();stickMove(e);},  {passive:false});
  stickEl.addEventListener('touchend',   e=>{e.preventDefault();stickEnd(e);},   {passive:false});
  stickEl.addEventListener('touchcancel', stickEnd);
}

// 拖动屏幕转头（手机）
const lookState = { id:null, x:0, y:0 };
renderer.domElement.addEventListener('touchstart', e=>{
  const t = e.changedTouches[0];
  if (!t) return;
  lookState.id = t.identifier; lookState.x = t.clientX; lookState.y = t.clientY;
}, {passive:true});
renderer.domElement.addEventListener('touchmove', e=>{
  if (lookState.id === null) return;
  for (const t of e.changedTouches){
    if (t.identifier !== lookState.id) continue;
    player.yaw   -= (t.clientX - lookState.x) * 0.0055;
    player.pitch -= (t.clientY - lookState.y) * 0.0055;
    player.pitch = Math.max(-1.15, Math.min(1.15, player.pitch));
    lookState.x = t.clientX; lookState.y = t.clientY;
  }
}, {passive:true});
renderer.domElement.addEventListener('touchend', e=>{
  for (const t of e.changedTouches) if (t.identifier === lookState.id) lookState.id = null;
}, {passive:true});

// ══════════════════════════════════════════════════ 开始 / 指针锁定
// ★★★ 2026-10-11 改（用户要求）：走廊提示页【只弹第一次】
//   原来：每次从宿舍按 E 回走廊 → 整页重载 → 又得看一遍提示、再点一次「进入」；
//         而且中途按 Esc 松鼠标，整页提示也会回来 —— 这就是"会反复触发"。
//   现在：第一次访问正常看提示并点「进入」；之后直接进走廊，Esc 后也不再弹整页提示。
let locked = false;
const startEl = document.getElementById('start');
const HUB_SEEN_KEY = 'dorm_hub_intro_seen';    // 与 walk.html 的 dorm_hub_entered 分开记
let hubIntroSeen = false;
try { hubIntroSeen = localStorage.getItem(HUB_SEEN_KEY) === '1'; } catch (e) {}

function enterCorridor(fromUser){
  startEl.classList.add('gone');
  running = true;
  if (fromUser){
    startBgm(true);                            // ★ 音频必须在用户手势里解锁
    try { renderer.domElement.requestPointerLock(); } catch (e) {}

// 点「进入」按钮、或点整块遮罩，都能进
const onStartClick = (e) => {
  if (e) e.stopPropagation();
  if (!loaded) return;
  if (!hubIntroSeen){
    hubIntroSeen = true;
    try { localStorage.setItem(HUB_SEEN_KEY, '1'); } catch (err) {}
  }

};
document.getElementById('startbtn').addEventListener('click', onStartClick);
startEl.addEventListener('click', onStartClick);

if (hubIntroSeen){
  console.log('%c★ 已看过走廊提示：直接进入（不再弹）', 'color:#5fd8e8');
  const tryEnter = (n) => {
    let ok = false;
    try { ok = (loaded === true); } catch (e) {}     // loaded 是 let，防 TDZ
    if (ok){ enterCorridor(false); return; }
    if (n > 400){                                    // 超时：还原提示页，别对着黑屏
      console.warn('走廊自动进入超时，退回显示提示页');
      startEl.classList.remove('gone');
      document.documentElement.classList.remove('hub-seen');
      return;
    }
    setTimeout(() => tryEnter(n + 1), 50);
  };
  startEl.classList.add('gone');
  setTimeout(() => tryEnter(0), 50);
  // 自动进入没有用户手势 → 音频等首次交互再解锁
  const unlock = () => {
    startBgm(true);
    document.removeEventListener('pointerdown', unlock);
    document.removeEventListener('keydown', unlock);
  };
  document.addEventListener('pointerdown', unlock);
  document.addEventListener('keydown', unlock);
} else {
  console.log('%c★ 首次进入走廊：显示提示页（之后不再弹）', 'color:#5fd8e8');
}

document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  if (!locked && running){
    running = false;
    // ★ 不再把整页提示拉回来（那就是"反复触发"）—— 只有没看过提示的人才需要它；
    //   看过的人直接点画面就能重新锁定。
    if (!hubIntroSeen){
      startEl.classList.remove('gone');
      document.getElementById('startbtn').textContent = '继续';
    }
  } else if (locked && !running){
    /* ★★★ 2026-10-13 修 BUG（用户实测：走廊里切出去再回来，WASD / 方向键全失灵）
       ─────────────────────────────────────────────────────────────────────
       原来上面把 `running = false` 之后，**没有任何地方把它设回 true** ——
       而 `animate()` 的移动整段包在 `if (running && loaded)` 里：
         切窗口(或按 Esc) → pointerlock 丢失 → running = false
         → 回来点画面重新锁定     → running 仍是 false  → **人完全动不了**
       ★ 为什么只有走廊出问题：`walk.html` 没有 `running` 这个闸门
         （它用 `entered` / `loaded`），所以宿舍和会客室都不受影响。
       → 一旦重新拿到 pointerlock，就把 running 恢复。 */
    running = true;
    console.log('%c★ 重新锁定指针 → 恢复移动（running=true）', 'color:#5fd8e8');
  }
});
// 点击画面重新锁定
renderer.domElement.addEventListener('click', () => {
  if (!loaded || locked) return;
  /* ★ 2026-10-13：`requestPointerLock()` 现在返回 Promise，且浏览器有
     「用户按 Esc 退出后短时间内拒绝重新锁定」的限制 —— 不加捕获会静默失败，
     表现又是"点了画面还是动不了"。这里把失败打出来，方便一眼看出是被浏览器拒了。 */
  try {
    const r = renderer.domElement.requestPointerLock();
    if (r && typeof r.catch === 'function'){
      r.catch((err) => console.warn('⚠ 重新锁定指针被拒绝（浏览器限制）：', err && err.message || err));
    }
  } catch (e) {
    console.warn('⚠ 重新锁定指针失败：', e);
  }
});

   回来时人自己往前走 —— 和上面那条 bug 正好是相反的症状。 */
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ══════════════════════════════════════════════════ 碰撞（走廊是个简单盒子）
function clampToCorridor(p){
  p.x = Math.max(BOUND.x0, Math.min(BOUND.x1, p.x));
  p.z = Math.max(BOUND.z0, Math.min(BOUND.z1, p.z));
}

// ══════════════════════════════════════════════════ 门口检测 & 进门
const promptEl = document.getElementById('prompt');
let nearDoor = null;
let entering = false;

/* ★★★ 2026-10-13：尽头隔断的"高亮"
   它没有 dframe（门框）——那是 6 扇侧墙门才有的件，所以用【整个隔断提亮】来代替
   "门框白边渐亮"，语义完全一样：走近了就有反应。
   基线 1.1 = 载入走廊模型那段对"名字含 partition"的材质做的自发光提亮值。 */
const PARTITION_EMI_BASE = 1.10, PARTITION_EMI_NEAR = 1.95;

function inEndDoorZone(){
  return player.pos.x > END_DOOR.trigX && Math.abs(player.pos.z) < END_DOOR.trigHalfZ;
}

/* ★★★ 2026-10-13 用户要求：门的提示要【准星对着门才显示】，对准别处马上消失。
   ─────────────────────────────────────────────────────────────────────────
   用户原话："我发现对于进入宿舍的门会在底部显示'按E进入xxx'的提示，
   准星移开之后还会存在一段时间，可以准星不对准门的时候马上消失吗。"
   ★ 真相：原来门提示是【纯距离判定】——`dist < 1.55` 就弹，**完全不看朝向**，
     所以"准星移开"对它没有任何影响，人站在门附近提示就会一直在。
   ⇒ 现在加上朝向判定：玩家前方与"指向门"的方向夹角必须小于这个阈值。
   ★ 取 ±62°（cos ≈ 0.47）：门宽 1.29 m，站在门前 0.6 m 处看门的**边缘**也才 ±47°，
     所以这个阈值足够宽松、不会让提示变得难触发；而"看着走廊正前方"（差 90°）必然不触发。 */
const DOOR_FACE_MIN = 0.47;

/** 玩家有没有【朝着】某个水平方向看（fx,fz = 玩家前方向；dx,dz = 指向目标，未归一化） */
function facingDir(fx, fz, dx, dz){
  const len = Math.hypot(dx, dz);
  if (!(len > 1e-4)) return false;
  return (fx * dx + fz * dz) / len >= DOOR_FACE_MIN;
}

function checkDoors(){
  /* ★★ 尽头门【优先】（实测踩到过的坑）：
     站在走廊尽头正中（例如 x=9.10, z=0）时，到侧墙 L2 门（x=9.0, z=+1.30）的距离
     只有 1.30 m < 1.55 的阈值 → 屏幕上弹出的却是「E 进入 安洁莉娜的信笺小屋」，
     人明明站在尽头。所以一进尽头区域就【不再找侧墙门】，同时把 6 个门框全熄掉。 */
  // 玩家前方向（hub.html 的约定：前方 = (-sin yaw, -cos yaw)）
  const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);

  /* 尽头门：既要站在尽头区（纯位置判定，inEndDoorZone 保持原语义不动 ——
     调试句柄 stats.atEndDoor 和自动化断言在用它），也要【面朝隔断】才提示。
     隔断中心 = (END_DOOR.x, (z0+z1)/2)。 */
  const endCz = (END_DOOR.z0 + END_DOOR.z1) / 2;
  const atEnd = inEndDoorZone() &&
    facingDir(fx, fz, END_DOOR.x - player.pos.x, endCz - player.pos.z);

  let best = null, bd = 1e9;
  if (!atEnd){
    for (const d of DOORS){
      /* ★ 2026-10-13：空门位（清单里 inHub 不足 6 个时补出来的 {theme:''}）不参与判定
         —— 否则会在一个什么都没有的门洞前弹出一个空提示框。 */
      const t = DOOR_THEME[d.idx];
      if (!t || !t.theme) continue;
      const dx = d.x - player.pos.x;              // ★ 指向门（用于朝向判定）
      const dz = d.z - player.pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist >= 1.55 || dist >= bd) continue;
      if (!facingDir(fx, fz, dx, dz)) continue;   // ★ 没朝着这扇门 → 不算
      bd = dist; best = d;
    }
  }
  // ★ 门框白边：靠近的那扇亮起来，其余熄灭（atEnd 时全部熄灭）
  for (const k in _frameByDoor){
    const d = DOORS.find(x => (x.side + Math.floor(x.idx / 2)) === k);
    const on = (best === d);
    for (const o of _frameByDoor[k]){
      const tgt = on ? 1.35 : 0.0;
      o.material.emissiveIntensity += (tgt - o.material.emissiveIntensity) * 0.25;
    }
  }
  // ★ 尽头隔断：靠近时提亮（替代它没有的"门框白边"）
  if (partitionMat){
    const tgt = atEnd ? PARTITION_EMI_NEAR : PARTITION_EMI_BASE;
    partitionMat.emissiveIntensity += (tgt - partitionMat.emissiveIntensity) * 0.12;
  }

  const near = atEnd ? END_DOOR : best;
  if (near !== nearDoor){
    nearDoor = near;
    if (near){
      const t = (near === END_DOOR) ? END_DOOR : DOOR_THEME[near.idx];
      promptEl.innerHTML = t.theme
        ? '<span class="k">E</span>进入 <span class="n">' + t.name + '</span>'
        : '<span class="n">' + t.name + '</span>';
      promptEl.classList.add('on');
    } else {
      promptEl.classList.remove('on');
    }
  }
}

/* ★★★ 2026-10-13：进门时的"向前推进"
   ─────────────────────────────────────────────────────────────────────────
   为什么需要：尽头是【一堵实墙（隔断）】。若按 E 就原地淡出→换页，观感会是
   "在墙前面凭空消失 / 穿墙"。
   用户已明确【不在隔断上开洞】（贴图本身就是门）、也不挂门牌，
   所以改用镜头语言来补这一下：
     站在尽头门口按 E → 镜头沿 +X 平滑推进 0.55 m（约 0.29 s）→ 淡出 → 换页
   = "朝着那扇门走进去"，而不是"原地传送"。
   ★ 推进终点用 BOUND.x1（10.35）夹住 → 保证镜头【不会真的穿过隔断】(x=10.78)。
   ★ 这段放在 animate() 的"移动块"【外面】：指针锁丢了也照样推进。 */
const enterDolly = { active: false, left: 0, speed: 1.9 };

function tryEnter(){
  if (!nearDoor || entering) return;
  let theme = null;
  if (nearDoor === END_DOOR){
    theme = END_DOOR.theme;
  } else {
    const t = DOOR_THEME[nearDoor.idx];
    if (!t || !t.theme) return;
    theme = t.theme;
  }
  entering = true;
  document.getElementById('fade').classList.add('on');

  const isEnd = (nearDoor === END_DOOR);
  if (isEnd){ enterDolly.active = true; enterDolly.left = 0.55; }

  // ★ 把 mode 带给房间（rig 回退时别丢）；只有真有 rig 备份的才带，否则 404
  let url = './walk.html?theme=' + encodeURIComponent(theme) + '&from=hub';
  if (HUB_MODE && hasRigBackup(theme)) url += '&mode=' + encodeURIComponent(HUB_MODE);

  setTimeout(() => { location.href = url; }, isEnd ? 620 : 340);
}

// ══════════════════════════════════════════════════ 画质
function cycleQuality(){
  qualityIdx = (qualityIdx + 1) % QUALITY.length;
  applyQuality();
  const el = document.getElementById('keyhelp');
  if (el) el.dataset.q = QUALITY[qualityIdx].name;
}
function applyQuality(){
  const q = QUALITY[qualityIdx];
  pixelRatio = Math.min(q.pr(), PR_MAX);
  renderer.setPixelRatio(pixelRatio);
  for (const t of allTextures) t.anisotropy = q.aniso;
}

    _note: '走廊导出 = localStorage 原始数据：{房间: {amb/key/fill/rim/pt/emi: {K=色温, i=强度}}}。' +
           '走廊拿不到"哪些房间没调过"的标记 —— 要完整报告请进宿舍后再按一次 Y。',
    rooms_raw: obj,
  }, null, 1);
  console.log('%c★★★ 宿舍光照参数（走廊导出）\n' + payload, 'color:#9fe8ff;font-size:13px');
  const n = Object.keys(obj).length;
  fetch('/__save_tune', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: payload,
  }).then((r) => (r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))))
    .then(() => hubToast('★ 已导出 ' + n + ' 个房间的光照参数 → 服务器'))
    .catch(() => hubToast('导出失败：服务器没有 /__save_tune 端点（请重启 node serve.js）'));
}

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'y' || e.key === 'Y') exportLightTune();
});

// ══════════════════════════════════════════════════ 主循环
const clock = new THREE.Clock();
let fpsAcc = 0, fpsN = 0, fpsT = 0;
const fpsEl = document.getElementById('fps');

/* ★★★ 2026-10-13 用户需求：帧率上限（和 walk.html 同一套，改档位的原因见那边注释）。
   ─────────────────────────────────────────────────────────────────────────
   ★★ 关键：rAF 只能以**屏幕刷新率的整数分之一**跑 —— 144Hz 屏上只有 144 / 72 / 48 / 36，
       **取不到 120**。所以档位不用"绝对 fps"，改成"屏刷的几分之一"（帧计数实现）。
         1/2 屏刷（144Hz → 72 fps，默认）· 不限（→ 144）· 1/3 屏刷（→ 48）
   ★ 跳帧那一次【不能调 clock.getDelta()】—— 否则 dt 会丢；不调它的话，
     下一帧拿到的是两帧之间的真实间隔，天然正确。 */
const FPS_DIVS = [2, 1, 3];            // 默认 1/2 屏刷；按一次 = 不限；再按 = 1/3
let fpsDivIdx = 0;
let fpsDiv = FPS_DIVS[0];
let _frameNo = 0;
let _screenHz = 0;
(function sampleScreenHz(){
  let n = 0, prev = 0, sum = 0;
  function step(now){
    if (n > 0) sum += (now - prev);
    prev = now; n++;
    if (n <= 31){ requestAnimationFrame(step); return; }
    const avg = sum / 30;
    _screenHz = avg > 0 ? Math.round(1000 / avg) : 0;
    if (_screenHz) console.log('%c★ 屏幕刷新率实测 ≈ %d Hz → 帧率上限可选 %d / %s / %d fps',
      'color:#8298ac', _screenHz, Math.round(_screenHz / 2), '不限', Math.round(_screenHz / 3));
  }
  requestAnimationFrame(step);
})();
function setFpsCap(i){
  fpsDivIdx = ((i % FPS_DIVS.length) + FPS_DIVS.length) % FPS_DIVS.length;
  fpsDiv = FPS_DIVS[fpsDivIdx];
  const hz = _screenHz;
  const msg = (fpsDiv === 1)
    ? ('帧率：不限制' + (hz ? ('（跟屏幕，约 ' + hz + ' fps）') : ''))
    : ('帧率上限：1/' + fpsDiv + ' 屏刷' + (hz ? ('（约 ' + Math.round(hz / fpsDiv) + ' fps）') : ''));
  if (typeof hubToast === 'function') hubToast(msg + '　Shift+Q 切换');
  console.log('%c★ ' + msg, 'color:#5fd8e8');
}

function animate(){
  requestAnimationFrame(animate);
  // ★ 帧率上限：每 fpsDiv 帧才画一次（屏刷还没测出来时不跳帧，免得把采样搞歪）
  if (fpsDiv > 1 && _screenHz > 0 && (_frameNo++ % fpsDiv) !== 0) return;
  const dt = Math.min(0.05, clock.getDelta());

  /* ★ 2026-10-13（需求 2）：面板开着时别移动。
     ★★ 这里的 `running` 是 2026-10-13 刚修过的那道闸门（切窗口丢锁的 bug），
        这里只【追加】一个条件，没动 running 本身。 */
  if (running && loaded && !isRoomPanelOpen()){
    // 移动方向
    const speed = (keys['ShiftLeft'] || keys['ShiftRight'] ? 3.4 : 1.9);
    let fw = 0, sd = 0;
    if (keys['KeyW'] || keys['ArrowUp'])    fw += 1;
    if (keys['KeyS'] || keys['ArrowDown'])  fw -= 1;
    if (keys['KeyA'] || keys['ArrowLeft'])  sd -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) sd += 1;
    /* ★ 手机摇杆（2026-10-14）：stick.y 向下为正 → 减去它（往上推 = 前进）；
       stick.x 向右为正 → 直接加（往右推 = 右移）。和键盘分量相加后再归一化，
       所以摇杆和键盘可以同时用、也不会因为叠加而变快。 */
    fw -= stick.y;
    sd += stick.x;
    const len = Math.hypot(fw, sd) || 1;
    fw /= len; sd /= len;

    const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
    // 前方 = (sin, -cos) 是 three.js 里 yaw=0 朝 -Z 的约定
    const vx = (fw * -sin + sd * cos) * speed * dt;
    const vz = (fw * -cos + sd * -sin) * speed * dt;

    player.pos.x += vx;
    player.pos.z += vz;
    clampToCorridor(player.pos);

    checkDoors();
  }

  // ★ 进门推进（尽头门专用）—— 放在移动块【外面】：指针锁丢了也照走
  if (enterDolly.active && enterDolly.left > 0){
    const step = Math.min(enterDolly.left, enterDolly.speed * dt);
    player.pos.x = Math.min(BOUND.x1, player.pos.x + step);   // 夹在 BOUND.x1，不穿隔断
    enterDolly.left -= step;
    if (enterDolly.left <= 0) enterDolly.active = false;
  }

  // 相机
  camera.position.set(player.pos.x, EYE, player.pos.z);
  camera.rotation.set(0, 0, 0);
  camera.rotateY(player.yaw);
  camera.rotateX(player.pitch);

  renderer.render(scene, camera);

  // FPS
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5){
    if (fpsEl) fpsEl.textContent = (fpsN / fpsAcc).toFixed(0) + ' FPS　' +
      '画质 ' + QUALITY[qualityIdx].name + '　' + pixelRatio.toFixed(2) + 'x';
    fpsAcc = 0; fpsN = 0;
  }
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ★★ 2026-10-13：只读调试句柄 —— 与 walk.html 的 `window.__FK` 同一约定。
   模块作用域的变量外部访问不到（连 `typeof running` 都是错的），
   排查"走廊里动不了"这类问题时需要从页面外读状态。
   ★ 只读约定：用它测量/读取，不要通过它改场景。 */
window.__FK_HUB = {
  three: THREE, scene, camera, renderer, player, keys,
  get running(){ return running; },
  get locked(){ return locked; },
  get loaded(){ return loaded; },
  get stats(){
    return {
      running, locked, loaded,
      keysDown: Object.keys(keys).filter(k => keys[k]),
      pos: [ +player.pos.x.toFixed(2), +player.pos.y.toFixed(2), +player.pos.z.toFixed(2) ],
      yawDeg: +(player.yaw * 180 / Math.PI).toFixed(1),
      /* ★★ 2026-10-13 修正：原来这里是 `nearDoor.name` —— 但侧墙门的对象是
         {x,z,side,idx}，【根本没有 name 字段】→ 站在 6 扇侧墙门前时它永远报 null，
         等于这个字段只在尽头门（END_DOOR 有 name）上才有效。排查时会被误导。
         现在分开报两个：nearDoor = 主题（唯一、好断言），nearDoorName = 中文名。 */
      nearDoor: nearDoor
        ? (nearDoor === END_DOOR ? END_DOOR.theme : ((DOOR_THEME[nearDoor.idx] || {}).theme || null))
        : null,
      nearDoorName: nearDoor
        ? (nearDoor === END_DOOR ? END_DOOR.name : ((DOOR_THEME[nearDoor.idx] || {}).name || null))
        : null,
      // ★ 2026-10-13 新增（都只读，方便无头脚本验证尽头门那套逻辑）
      from: FROM_THEME || null,
      atEndDoor: (typeof inEndDoorZone === 'function') ? inEndDoorZone() : null,
      partitionEmi: partitionMat ? +partitionMat.emissiveIntensity.toFixed(3) : null,
      dollyLeft: +enterDolly.left.toFixed(3),
    };
  },
};
</script>
</body>
